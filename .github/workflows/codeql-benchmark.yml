# Trigear Lab benchmark scan, Tier 2 rows (RUNBOOK H22 method, H29h; S9). Rendered by bench/ghas/make_t2_mirrors.py;
# edit the template, not the copy in the mirror. Manual dispatch only: nothing runs on push.
# Differences from codeql-benchmark.yml.tmpl (H13/H22): the CodeQL bundle is not pinned (the version GitHub ships on
# the scan date runs and is read from the SARIF, lead 2 Nov); the build mode is per language (none, or autobuild for
# Go, as the AWS Tier 2 runs); the database's source archive is listed into codeql.files.txt (the analysed files).
name: codeql-benchmark
on:
  workflow_dispatch:
    inputs:
      queries:
        description: CodeQL query suite
        default: security-extended
        type: choice
        options: [security-extended, default]
permissions:
  contents: read
  security-events: write
concurrency: codeql-benchmark
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Plain fetch of the dispatched commit (lead, 2 Nov): actions/checkout fails on a gitlink with no .gitmodules
      # entry (umbraco); this checks out the same tree with no submodule handling and no stored credentials
      - name: Check out (git fetch)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='checked out %H tree %T'
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: "python"
          build-mode: "none"
          queries: ${{ inputs.queries }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:python/${{ inputs.queries }}"
          upload: never
          output: sarif-out
      - name: List the analysed files
        run: |
          set -euo pipefail
          db="${{ runner.temp }}/codeql_databases/python"
          ls "$db"
          unzip -Z1 "$db/src.zip" | grep -v '/$' > sarif-out/codeql.files.txt
          wc -l sarif-out/codeql.files.txt
      - name: Split for upload
        run: |
          ls -la sarif-out
          f=$(ls sarif-out/*.sarif | head -1)
          python3 .github/benchmark/split_sarif.py "$f" chunks \
            "/language:python/${{ inputs.queries }}" "$GITHUB_SHA" "$GITHUB_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codeql-sarif-${{ inputs.queries }}
          path: |
            sarif-out/
            chunks/chunks.json
          retention-days: 90
      - name: Upload parts to code scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for body in chunks/part-*.json; do
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/code-scanning/sarifs" --input "$body" --jq .id)
            echo "$body -> $id"
            for i in $(seq 1 120); do
              st=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/sarifs/$id" --jq .processing_status)
              [ "$st" = complete ] && break
              [ "$st" = failed ] && { gh api "repos/$GITHUB_REPOSITORY/code-scanning/sarifs/$id"; exit 1; }
              sleep 10
            done
            echo "  $st"
          done
